name: "Build"

on:
  workflow_dispatch:
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: "Windows"
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "PyInstaller"
        run: |
          python -m pip install -U pip
          python -m pip install --group build
          run pyinstaller
          run manifest

      - name: "Download FFmpeg"
        uses: robinraju/release-downloader@v1.10
        with:
          repository: BtbN/FFmpeg-Builds
          fileName: ffmpeg-master-latest-win64-gpl.zip
          out-file-path: dist
          latest: true
          extract: true

      - name: "Move FFmpeg"
        run: |
          mv dist/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe dist/ffmpeg.exe
          file dist/ffmpeg.exe

      - name: "Write Version"
        if: ${{ github.event_name == 'release' }}
        run: |
          echo github.ref_name: "${{ github.ref_name }}"
          echo "${{ github.ref_name }}" > src/version.txt
          cat -n src/version.txt

      - name: "Inno Setup"
        env:
          version: ${{ github.event_name == 'release' && github.ref_name || '0.0.1' }}
        shell: pwsh
        run: |
          echo "Building Version: $Env:version"
          iscc.exe "/DMyAppVersion=$Env:version" client.iss

      - name: "Debug Output"
        continue-on-error: true
        run: |
          ls -lAhR out

      - name: "Upload to Actions"
        uses: actions/upload-artifact@v6
        with:
          name: install-win
          path: out

      - name: "Upload Release"
        if: ${{ github.event_name == 'release' }}
        uses: cssnr/upload-release-action@v1
        with:
          globs: out/*
          overwrite: true

  linux:
    name: "Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Download FFmpeg"
        uses: robinraju/release-downloader@v1.10
        with:
          repository: BtbN/FFmpeg-Builds
          fileName: ffmpeg-master-latest-linux64-gpl.tar.xz
          out-file-path: dist
          latest: true

      - name: "Move FFmpeg"
        run: |
          tar -xf dist/ffmpeg-master-latest-linux64-gpl.tar.xz -C dist ffmpeg-master-latest-linux64-gpl/bin/ffmpeg
          mv dist/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg dist/ffmpeg
          file dist/ffmpeg

      - name: "Write Version"
        if: ${{ github.event_name == 'release' }}
        run: |
          echo github.ref_name: "${{ github.ref_name }}"
          echo "${{ github.ref_name }}" > src/version.txt
          cat -n src/version.txt

      - name: "Debian Package"
        run: |
          python manifest.py
          bash build-linux.sh

      - name: "Debug Output"
        continue-on-error: true
        run: |
          ls -lAhR out

      - name: "Upload to Actions"
        uses: actions/upload-artifact@v6
        with:
          name: install-linux
          path: out

      - name: "Upload Release"
        if: ${{ github.event_name == 'release' }}
        uses: cssnr/upload-release-action@v1
        with:
          globs: out/*
          overwrite: true

  macos:
    name: "macOS Intel"
    runs-on: macos-15-intel
    timeout-minutes: 5
    # NOTE: This downloads MacOS Intel FFMpeg and should build on macos-15-intel

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Setup Packages"
        # noinspection HttpUrlsUsage
        run: |
          curl http://s.sudre.free.fr/Software/files/Packages.dmg -o Packages.dmg
          hdiutil attach Packages.dmg
          sudo installer -pkg "/Volumes/Packages 1.2.10/Install Packages.pkg" -target /
          hdiutil detach "/Volumes/Packages 1.2.10"

      - name: "Download FFmpeg"
        run: |
          mkdir -p dist
          curl -L "https://evermeet.cx/ffmpeg/getrelease/zip" -o "dist/ffmpeg.zip"
          unzip dist/ffmpeg.zip -d "dist"
          file dist/ffmpeg

      - name: "Write Version"
        if: ${{ github.event_name == 'release' }}
        run: |
          echo github.ref_name: "${{ github.ref_name }}"
          echo "${{ github.ref_name }}" > src/version.txt
          cat -n src/version.txt

      - name: "PyInstaller"
        run: |
          python -m pip install -U pip
          python -m pip install --group build
          run pyinstaller
          run manifest
          bash build-mac.sh

      - name: "Debug Output"
        continue-on-error: true
        run: |
          ls -lAhR out

      - name: "Upload to Actions"
        uses: actions/upload-artifact@v6
        with:
          name: install-macos
          path: out

      - name: "Upload Release"
        if: ${{ github.event_name == 'release' }}
        uses: cssnr/upload-release-action@v1
        with:
          globs: out/*
          overwrite: true

  virustotal:
    name: "VirusTotal Scan"
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    timeout-minutes: 5
    if: ${{ github.event_name == 'release' }}

    steps:
      - name: "VirusTotal"
        uses: cssnr/virustotal-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release: true
          collapsed: true
