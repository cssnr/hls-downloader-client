name: "Lint"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Debug event.json"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: cat "${GITHUB_EVENT_PATH}"
      - name: "Debug CTX github"
        if: ${{ !github.event.act }}
        continue-on-error: true
        env:
          GITHUB_CTX: ${{ toJSON(github) }}
        run: echo "$GITHUB_CTX"
      - name: "Debug Environment"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: env

      - name: "Setup Python 3.10"
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: "Install"
        id: install
        run: |
          python -m pip install -U pip
          python -m pip install --group dev

      - name: "astral-sh/ruff"
        if: ${{ !cancelled() }}
        uses: astral-sh/ruff-action@57714a7c8a2e59f32539362ba31877a1957dded1 # v3.5.1
        with:
          version: latest

      - name: "astral-sh/ty"
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: |
          ty check -v

      - name: "psf/black"
        if: ${{ !cancelled() }}
        uses: psf/black@stable

      - name: "isort"
        if: ${{ !cancelled() }}
        uses: isort/isort-action@24d8a7a51d33ca7f36c3f23598dafa33f7071326 # v1.1.1

      - name: "mypy"
        if: ${{ !cancelled() }}
        run: |
          toml-run mypy

      - name: "bandit"
        if: ${{ !cancelled() }}
        run: |
          toml-run bandit

      - name: "tombi"
        if: ${{ !cancelled() }}
        run: |
          tombi lint

      - name: "yamllint"
        if: ${{ !cancelled() }}
        run: |
          toml-run yamllint

      - name: "prettier"
        if: ${{ !cancelled() }}
        run: |
          echo "::group::Install"
          npm install prettier
          echo "::endgroup::"
          npx prettier --check .

      - name: "actionlint"
        if: ${{ !cancelled() }}
        uses: cssnr/actionlint-action@v1
        with:
          shellcheck_opts: -e SC2012

      - name: "ShellCheck"
        if: ${{ !cancelled() }}
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -x
