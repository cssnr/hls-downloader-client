[project]
name = "hls-downloader-app"
version = "0.0.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
# dependencies = ["pyinstaller==6.8.0"]

[dependency-groups]
dev = [
  "bandit>=1.7.10",
  "black>=24.8.0",
  "isort>=5.13.2",
  "mypy>=1.14.1",
  "ruff>=0.14.9",
  "tombi>=0.7.7",
  "ty>=0.0.7",
  "yamllint>=1.35.1",
  { include-group = "build" },
]
build = [
  "pyinstaller==6.8.0",
  "toml-run>=0.0.2",
]

# Bandit
# https://bandit.readthedocs.io/en/latest/config.html
[tool.bandit]
exclude_dirs = ["venv"]
skips = ["B105", "B404", "B603"]
assert_used = { skips = ["*test_*.py"] }

# Black
# https://black.readthedocs.io/en/stable/usage_and_configuration/
[tool.black]
line-length = 119
extend-exclude = '(\.github)'

# Coverage
# https://coverage.readthedocs.io/en/latest/
[tool.coverage.run]
omit = ["_version.py"]
source = ["src"]

# Isort
# https://pycqa.github.io/isort/docs/configuration/options.html
[tool.isort]
profile = "black"
# lines_after_imports = 2
src_paths = ["src", "test"]
skip = ["venv", ".github"]

# Mypy
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
# ignore_missing_imports = true
exclude = ["venv"]

# Ruff
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 119
target-version = "py313"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q"]

# Scripts
# https://github.com/cssnr/toml-run
[tool.scripts]
inno = "iscc.exe client.iss"
manifest = "python manifest.py"
pyinstaller = "pyinstaller -y -D -n client -i src/favicon.ico --hidden-import pkg_resources.extern src/client.py"
format = ["black .", "tombi format .", "ruff format ."]
lint = [
  "run bandit",
  "run mypy",
  "run ruff",
  "run yamllint",
  "black --check .",
  "tombi lint .",
  # "ty check -v .",
]
bandit = "bandit -c pyproject.toml -r ."
mypy = "mypy ."
ruff = "ruff check ."
yamllint = "yamllint -c .github/yamllint.yaml ."
